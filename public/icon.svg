<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="nrcs-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="red-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#nrcs-grad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4" />

  <!-- TV Broadcast Screen Frame -->
  <rect x="76" y="86" width="360" height="250" rx="28" fill="#1e293b" stroke="#475569" stroke-width="6" />
  
  <!-- Screen Inner Display -->
  <rect x="94" y="104" width="324" height="214" rx="18" fill="#0f172a" />
  
  <!-- Waveform / Broadcast Signals inside Screen -->
  <path d="M 120 211 L 155 211 L 175 145 L 205 277 L 235 170 L 265 240 L 285 190 L 310 220 L 330 211 L 392 211" 
        fill="none" stroke="url(#accent-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Live On-Air Pill inside Screen -->
  <g transform="translate(112, 122)">
    <rect width="84" height="28" rx="8" fill="url(#red-badge)" />
    <circle cx="16" cy="14" r="5" fill="#ffffff" />
    <text x="30" y="19" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#ffffff" letter-spacing="1">LIVE</text>
  </g>

  <!-- Stand / Base of the Broadcast Console -->
  <path d="M 220 336 L 200 400 L 312 400 L 292 336 Z" fill="#334155" />
  <rect x="160" y="400" width="192" height="24" rx="10" fill="#475569" />

  <!-- Bottom Indicator LEDs -->
  <circle cx="216" cy="412" r="4" fill="#10b981" filter="url(#glow)" />
  <circle cx="256" cy="412" r="4" fill="#3b82f6" />
  <circle cx="296" cy="412" r="4" fill="#f59e0b" />
</svg>
