name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install browser for workflow tests
        run: npx playwright install --with-deps chromium
      - name: Critical newsroom and production workflows
        run: npx playwright test tests/e2e/news-status-confirmation.spec.ts tests/e2e/news-ux.spec.ts tests/e2e/journey-fixes.spec.ts tests/e2e/collaboration.spec.ts tests/e2e/desk-improvements.spec.ts tests/e2e/settings-controls.spec.ts tests/e2e/settings-accessibility.spec.ts tests/e2e/datetime.spec.ts tests/e2e/news-customization.spec.ts tests/e2e/bulletin-save-confirmation.spec.ts tests/e2e/editorial-team-journey.spec.ts tests/e2e/editorial-mobile.spec.ts tests/e2e/editorial-keyboard.spec.ts tests/e2e/editorial-source-comparison.spec.ts
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
      - name: Smoke test production build
        env:
          NODE_ENV: production
          DATA_DIR: ${{ runner.temp }}/nrcs-data
          ADMIN_EMAIL: ci-admin@example.com
          ADMIN_PASSWORD: CiAdminPassword2026
          COOKIE_SECURE: 'false'
          PORT: '3100'
        run: |
          node dist/server.cjs &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3100/api/ready && break; sleep 1; done
          curl -sf http://127.0.0.1:3100/api/ready
          curl -sf http://127.0.0.1:3100/ | grep -q '<div id="root">'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'X-NRCS-Client: web' \
            -d '{"email":"ci-admin@example.com","password":"CiAdminPassword2026"}' http://127.0.0.1:3100/api/v1/auth/login)
          test "$code" = "200"
      - name: Offline air and prompter workflows
        run: npx playwright test tests/e2e/offline-air-preparation.spec.ts tests/e2e/offline-air-shell.spec.ts tests/e2e/offline-air-store.spec.ts tests/e2e/offline-air-drafts.spec.ts tests/e2e/prompter-controls.spec.ts tests/e2e/production-lists-settings.spec.ts tests/e2e/production-name-fields.spec.ts tests/e2e/air-text-display.spec.ts
      - name: Database administration workflows
        run: npx playwright test tests/e2e/database-operations.spec.ts
