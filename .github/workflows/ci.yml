name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: madar_ci
          POSTGRES_USER: madar_ci
          POSTGRES_PASSWORD: madar_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U madar_ci -d madar_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run lint
      - name: Tests
        env:
          POSTGRES_TEST_URL: postgresql://madar_ci:madar_ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/madar_ci
        run: npm test
      - name: Build
        run: npm run build
      - name: Install browsers for workflow tests
        run: npx playwright install --with-deps chromium webkit
      - name: Work controls across Chromium and WebKit on desktop and mobile
        run: npm run test:e2e:work-controls
      - name: Upload work controls failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: work-controls-failures
          path: test-results/
          retention-days: 7
      - name: Critical newsroom and production workflows
        run: >-
          node tests/e2e/run-isolated.mjs tests/e2e/news-status-confirmation.spec.ts tests/e2e/news-ux.spec.ts
          tests/e2e/journey-fixes.spec.ts tests/e2e/collaboration.spec.ts tests/e2e/desk-improvements.spec.ts
          tests/e2e/settings-controls.spec.ts tests/e2e/settings-accessibility.spec.ts tests/e2e/datetime.spec.ts
          tests/e2e/news-customization.spec.ts tests/e2e/bulletin-save-confirmation.spec.ts tests/e2e/editorial-team-journey.spec.ts
          tests/e2e/editorial-mobile.spec.ts tests/e2e/editorial-keyboard.spec.ts tests/e2e/editorial-source-comparison.spec.ts
          tests/e2e/department-work.spec.ts tests/e2e/support-work.spec.ts tests/e2e/task-workflow-settings.spec.ts
          tests/e2e/premerge-integrations.spec.ts tests/e2e/setup-lifecycle.spec.ts
      - name: Login and logout experience
        run: node tests/e2e/run-isolated.mjs tests/e2e/auth-ux.spec.ts tests/e2e/account-security.spec.ts
      - name: Daily role and editorial AI workflows
        run: node tests/e2e/run-isolated.mjs daily-work daily-role saved-news-filters shift-handovers shift-handover-resilience production-work-queues field-media-upload editorial-ai app-updates personal-tasks work-reminders
      - name: Multi-station production and CSV exports
        run: node tests/e2e/run-isolated.mjs production-cards
      - name: Department hierarchy, assignment routing and print previews
        run: >-
          node tests/e2e/run-isolated.mjs tests/e2e/department-chart.spec.ts tests/e2e/assignment-routing.spec.ts
          tests/e2e/production-print.spec.ts tests/e2e/workspace-polish.spec.ts
      - name: Bulletin assembly and programme templates
        run: node tests/e2e/run-isolated.mjs bulletin-copy program-preparation
      - name: Desktop and mobile planning and production layouts
        run: node tests/e2e/run-isolated.mjs tests/e2e/catalog-responsive.spec.ts tests/e2e/planning-responsive.spec.ts tests/e2e/production-mobile.spec.ts tests/e2e/ux.spec.ts
      - name: Workspace navigation and responsive route coverage
        run: node tests/e2e/run-isolated.mjs tests/e2e/workspace-shell.spec.ts tests/e2e/website-transformation.spec.ts
      - name: Newsroom 4.4 editing, intake and studio workflows
        run: node tests/e2e/run-isolated.mjs tests/e2e/news-taxonomy.spec.ts tests/e2e/presenter-instructions.spec.ts tests/e2e/v44-workspaces.spec.ts
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
      - name: Smoke test production build
        env:
          NODE_ENV: production
          DATA_DIR: ${{ runner.temp }}/nrcs-data
          ADMIN_EMAIL: ci-admin@example.com
          ADMIN_PASSWORD: CiAdminPassword2026
          COOKIE_SECURE: 'false'
          PORT: '3100'
        run: |
          node dist/server.cjs &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3100/api/ready && break; sleep 1; done
          curl -sf http://127.0.0.1:3100/api/ready
          curl -sf http://127.0.0.1:3100/ | grep -q '<div id="root">'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'X-NRCS-Client: web' \
            -d '{"email":"ci-admin@example.com","password":"CiAdminPassword2026"}' http://127.0.0.1:3100/api/v1/auth/login)
          test "$code" = "200"
      - name: Offline air and prompter workflows
        run: node tests/e2e/run-isolated.mjs tests/e2e/offline-air-preparation.spec.ts tests/e2e/offline-air-shell.spec.ts tests/e2e/offline-air-store.spec.ts tests/e2e/offline-air-drafts.spec.ts tests/e2e/prompter-controls.spec.ts tests/e2e/production-lists-settings.spec.ts tests/e2e/production-name-fields.spec.ts tests/e2e/air-text-display.spec.ts
      - name: Recover an in-flight editor lock after navigation
        run: node tests/e2e/run-isolated.mjs lock-unload lock-reload-leave
      - name: Database administration workflows
        env:
          POSTGRES_URL: postgresql://madar_ci:madar_ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/madar_ci
          DATABASE_ENGINE: sqlite
        run: node tests/e2e/run-isolated.mjs tests/e2e/database-operations.spec.ts tests/e2e/database-engine.spec.ts tests/e2e/module-access.spec.ts

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the production container and test its persistent volume
        run: |
          export RELEASE_VERSION="$(node -p 'require("./package.json").version')"
          bash scripts/smoke-release-container.sh
